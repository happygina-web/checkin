<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<title>챌린지아카데미어학원 참석 확인</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page">
  <div class="crop logo"><img src="img/logo-horizontal.png" alt="챌린지아카데미어학원"></div>

  <section id="view-loading" class="view"><div class="loader" aria-label="불러오는 중"></div></section>

  <section id="view-notice" class="view" hidden>
    <div class="notice">
      <p id="notice-event" class="event" hidden></p>
      <p id="notice-msg" class="msg"></p>
      <button id="retry" class="btn retry" type="button" hidden>다시 시도</button>
    </div>
  </section>

  <form id="view-form" class="view" novalidate hidden>
    <h1 class="title"><span id="form-event"></span><br>참석 확인</h1>

    <div id="benefit" class="benefit" hidden>
      <p class="benefit-head">참석 혜택 <strong>교육비 할인권 <span id="benefit-amount"></span></strong></p>
      <p class="benefit-desc">참석 완료를 누르면 할인권이 신청되어 카카오톡으로 발급돼요</p>
    </div>

    <label class="label" for="name">학생 이름</label>
    <input class="input" id="name" name="name" type="text" maxlength="20" autocomplete="off" placeholder="김민준">

    <label class="label" for="phone">학부모님 휴대폰 번호</label>
    <input class="input" id="phone" name="phone" type="text" inputmode="numeric" maxlength="13" autocomplete="tel" placeholder="010-1234-5678">

    <div class="consent">
      <div class="consent-row">
        <label class="check">
          <input id="consent" type="checkbox">
          <span class="box" aria-hidden="true"></span>
          <span>참석 확인 및 참석 혜택 신청·발급을 위한 개인정보 수집·이용에 동의합니다</span>
        </label>
        <button id="more" class="more" type="button" aria-expanded="false" aria-controls="legal">자세히</button>
      </div>
      <div id="legal" class="legal" hidden>
        <dl>
          <dt>수집 항목</dt><dd>학생 이름·학부모 휴대폰 번호</dd>
          <dt>목적</dt><dd>행사 참석 확인 및 참석 혜택(할인권) 발급</dd>
          <dt>보관 기간</dt><dd>5년</dd>
        </dl>
        <p>동의를 거부할 수 있으나 이 경우 체크인과 혜택 발급이 불가합니다</p>
      </div>
    </div>

    <div class="form-end">
      <p id="form-error" class="error" role="alert"></p>
      <button id="submit" class="btn" type="submit">참석 완료</button>
    </div>
  </form>

  <section id="view-done" class="view center" hidden>
    <div class="ok-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 class="title ok-title">참석이 확인됐어요</h1>
    <p class="sub"><span id="done-name"></span> 학부모님,<br>참석해 주셔서 감사합니다.</p>
    <div id="done-coupon" hidden>
      <div id="done-sent" class="kakao">교육비 할인권(<span class="done-amount"></span>)을<br>카카오톡으로 보내드렸어요</div>
      <div id="done-unsent" class="kakao" hidden>교육비 할인권(<span class="done-amount"></span>)이<br>준비됐어요</div>
      <p id="done-unsent-hint" class="sub done-hint" hidden>아래 버튼을 눌러 확인해 주세요</p>
    </div>
    <div class="spacer"></div>
    <a id="done-link" class="btn secondary" href="#" hidden>쿠폰 바로 보기</a>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/format.js"></script>
<script src="js/api.js"></script>
<script src="js/mock-api.js"></script>
<script src="js/checkin.js"></script>
</body>
</html>
